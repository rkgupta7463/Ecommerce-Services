version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ecomm_microservice_db
    restart: always

    environment:
      POSTGRES_USER: rishu12
      POSTGRES_PASSWORD: Rishu@12
      POSTGRES_DB: ecomm_microservice
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rishu12 -d ecomm_microservice"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: